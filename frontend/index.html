<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Hostel Complaint System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Cloud Hostel Complaints</h1>
        <nav>
            <a href="index.html">Student Portal</a>
            <a href="admin.html">Admin Dashboard</a>
        </nav>
    </header>

    <main>
        <div class="card" id="form-card">
            <h2>Submit a Complaint</h2>
            <p class="text-light mb-2">Please fill out the details below to report an issue.</p>
            
            <div id="alert-container"></div>

            <form id="complaint-form">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Enter your email address">
                </div>

                <div class="form-group">
                    <label for="hostelBlock">Hostel Block</label>
                    <select id="hostelBlock" required>
                        <option value="">Select Block</option>
                        <option value="Block A">Block A</option>
                        <option value="Block B">Block B</option>
                        <option value="Block C">Block C</option>
                        <option value="Block D">Block D</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Cleaning">Cleaning</option>
                        <option value="Food">Food</option>
                        <option value="Room">Room</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Complaint Description</label>
                    <textarea id="description" rows="4" required placeholder="Describe your issue in detail..."></textarea>
                </div>

                <button type="submit" class="btn" id="submit-btn">Submit Complaint</button>
            </form>
        </div>

        <div class="card d-none" id="success-card">
            <div class="text-center">
                <h2>Complaint Submitted Successfully!</h2>
                <p class="mt-2">Your complaint ID is: <strong id="display-id"></strong></p>
                <p>Status: <span class="status-badge status-pending mt-2">Pending</span></p>
                <button class="btn mt-2" id="new-complaint-btn">Submit Another Complaint</button>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
