<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Cloud Hostel Complaint System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Cloud Hostel Complaints - Admin</h1>
        <nav>
            <a href="index.html">Student Portal</a>
            <a href="admin.html">Admin Dashboard</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <div class="flex justify-between" style="align-items: center; margin-bottom: 1.5rem;">
                <h2>All Complaints</h2>
                
                <div>
                    <label for="status-filter" style="margin-right: 0.5rem; font-weight: 500;">Filter by Status:</label>
                    <select id="status-filter" style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
                        <option value="">All</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
            </div>

            <div id="alert-container"></div>

            <div style="overflow-x: auto;">
                <table id="complaints-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Student</th>
                            <th>Block</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="complaints-body">
                        <!-- Data will be populated here -->
                        <tr>
                            <td colspan="7" class="text-center">Loading complaints...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
